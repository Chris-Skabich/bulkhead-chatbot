services:
  # 1. FastAPI Core Web Server
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/bulkhead-bot-backend
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
    
  # 2. Background worker Celery
  celery_worker:
    build: .
    volumes:
      - .:/bulkhead-bot-backend
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    depends_on:
      - redis

  # 3. Message Queue Broker (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    
  # 4. Mock email server Dashboard (Mailpit)
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web UI Dashboard
      - "1025:1025" # SMTP Port